name: Run command in dev-container
description: Run commands inside the default devcontainer
inputs:
  run:
    description: Commands to run inside the container
    required: true
  shell:
    description: Shell used inside the container
    default: bash --noprofile --norc -eo pipefail
  app:
    description: Docker Compose service
    default: app
runs:
  using: composite
  steps:
    - name: Build image from docker-compose
      uses: ./.github/actions/cached-build
      with:
        branch: main
        push_to_registry: false
    - name: Run script in docker
      shell: bash
      env:
        DEV_CONTAINER_APP: ${{ inputs.app }}
        DEV_CONTAINER_RUN: ${{ inputs.run }}
        DEV_CONTAINER_SHELL: ${{ inputs.shell }}
      run: |
        read -r -a shell_args <<< "$DEV_CONTAINER_SHELL"
        printf '%s\n' "$DEV_CONTAINER_RUN" | docker compose run --rm \
          --volume /home/runner:/home/runner/ \
          "$DEV_CONTAINER_APP" "${shell_args[@]}" -s
